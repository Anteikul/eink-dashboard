<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up Wi-Fi · E‑ink</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/locale.js" defer></script>
  <script src="/wifi.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n>Set up Wi-Fi</h1>
      <p class="intro" data-i18n>Choose the 2.4 GHz network the Raspberry Pi should join.</p>
    </header>
    <section class="setup" aria-labelledby="wifi-heading">
      <h2 id="wifi-heading" data-i18n>Network details</h2>
      <form id="wifi-form" class="setup-form" method="post" action="/api/wifi">
        <label for="wifi-ssid" data-i18n>Network name (SSID)</label>
        <input id="wifi-ssid" name="ssid" maxlength="32" autocomplete="off" spellcheck="false" required>
        <label for="wifi-password" data-i18n>Network password</label>
        <input id="wifi-password" name="password" type="password" maxlength="64" autocomplete="off">
        <p data-i18n>For an open network, leave the password empty.</p>
        <button type="submit" data-i18n>Connect Raspberry Pi</button>
      </form>
      <p id="setup-status" role="status" data-i18n></p>
    </section>
  </main>
</body>
</html>
