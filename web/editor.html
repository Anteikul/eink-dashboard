<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece5">
  <title>Edit layouts · E‑ink</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/locale.js" defer></script>
  <script src="/editor.js" defer></script>
</head>
<body>
  <main id="layout-editor">
    <header class="editor-header">
      <a class="editor-back editor-icon" href="/" id="editor-back" aria-label="Back to display" data-i18n-attributes="aria-label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m7-7-7 7 7 7"/></svg>
      </a>
      <h1 data-i18n>Edit layouts</h1>
    </header>
    <p id="editor-access-status" class="editor-message" role="status"></p>
    <div id="editor-access-actions" class="access-actions" hidden>
      <a id="editor-sign-in" href="/unlock?next=editor" target="_blank" rel="noopener" data-i18n hidden>Sign in again</a>
      <button id="editor-access-retry" type="button" data-i18n>Try again</button>
    </div>
    <div id="editor-content" hidden>
      <div class="editor-topbar">
        <div class="editor-tabs" role="tablist" aria-label="Layouts" data-i18n-attributes="aria-label">
          <button id="editor-dashboard-tab" class="editor-icon" type="button" role="tab" aria-label="Dashboard" aria-selected="true" aria-controls="editor-panel" data-screen="dashboard" data-label="Dashboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v16H3ZM3 9h18M11 9v11m3-7h4m-4 4h4"/></svg>
            <span class="editor-tab-dirty" hidden aria-hidden="true">•</span>
          </button>
          <button id="editor-playback-tab" class="editor-icon" type="button" role="tab" aria-label="Playback" aria-selected="false" aria-controls="editor-panel" data-screen="playback" data-label="Playback" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 10 6-10 6V6ZM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/></svg>
            <span class="editor-tab-dirty" hidden aria-hidden="true">•</span>
          </button>
        </div>
        <div class="editor-actions">
          <button id="editor-library-toggle" class="editor-icon" type="button" aria-label="Saved layouts" data-i18n-attributes="aria-label" aria-expanded="false" aria-controls="editor-library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h6l2 2h10v13H3Zm0 4h18m-11 4h4"/></svg>
          </button>
          <button id="editor-blank" class="editor-icon" type="button" aria-label="Start blank" data-i18n-attributes="aria-label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h9l5 5v13H5Zm9 0v5h5"/></svg>
          </button>
          <button id="editor-reset" class="editor-icon" type="button" aria-label="Reset to default" data-i18n-attributes="aria-label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5m-5-.5a8.5 8.5 0 1 1 .9 8.6"/></svg>
          </button>
          <button id="editor-save" class="editor-icon" type="button" aria-label="Apply to display" data-i18n-attributes="aria-label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3Zm3 0v6h10V3M7 21v-8h10v8m-3-15v3"/></svg>
          </button>
        </div>
      </div>
      <div id="editor-panel" role="tabpanel" aria-labelledby="editor-dashboard-tab">
        <div class="editor-grid">
          <section class="editor-preview" aria-labelledby="editor-preview-title">
            <div class="section-line">
              <h3 id="editor-preview-title" data-i18n>Display canvas</h3>
              <span id="editor-resolution">250 × 122 px</span>
            </div>
            <div id="editor-toolbar" class="editor-toolbar">
              <div id="editor-tools" class="editor-tools" role="group" aria-label="Canvas tools" data-i18n-attributes="aria-label">
                <button type="button" class="editor-icon" data-tool="select" aria-label="Select" data-i18n-attributes="aria-label" aria-pressed="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 10-7 1.5L8.5 21 5 3Z"/></svg>
                </button>
                <button type="button" class="editor-icon" data-tool="draw" aria-label="Draw" data-i18n-attributes="aria-label" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L21 7l-4-4L4 16Zm10-10 4 4m-14 6 4 4"/></svg>
                </button>
                <button type="button" class="editor-icon" data-tool="erase" aria-label="Eraser" data-i18n-attributes="aria-label" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20h10M7.5 19.5l-4-4a2 2 0 0 1 0-2.8l8.9-8.9a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8l-8.4 8.4h-3a2 2 0 0 1-1.3-.5ZM8 8l8 8"/></svg>
                </button>
                <button id="editor-snap" class="editor-icon" type="button" aria-label="Snap" data-i18n-attributes="aria-label" aria-pressed="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h5v9a4 4 0 0 0 8 0V4h5v9a9 9 0 0 1-18 0V4Zm0 5h5m8 0h5"/></svg>
                </button>
              </div>
              <div id="editor-history" class="editor-history">
                <button id="editor-undo" class="editor-icon" type="button" aria-label="Undo" data-i18n-attributes="aria-label" aria-keyshortcuts="Control+Z Meta+Z">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 6 6v3"/></svg>
                </button>
                <button id="editor-redo" class="editor-icon" type="button" aria-label="Redo" data-i18n-attributes="aria-label" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0-6 6v3"/></svg>
                </button>
              </div>
            </div>
            <div class="editor-contextbar">
              <div id="editor-brush-options" class="editor-brush-options" hidden>
                <div id="editor-brush-width" class="editor-tool-size" hidden>
                  <label id="editor-brush-label" class="editor-icon" for="editor-brush" aria-label="Brush width" data-i18n-attributes="aria-label">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16m-16 7h16m-16 7h16" stroke-width="1.5"/><path d="M5 12h14" stroke-width="2.5"/><path d="M6 19h12" stroke-width="4"/></svg>
                  </label>
                  <select id="editor-brush" aria-labelledby="editor-brush-label">
                    <option value="1">1 px</option>
                    <option value="3">3 px</option>
                    <option value="5">5 px</option>
                    <option value="9">9 px</option>
                  </select>
                </div>
                <button id="editor-clear-drawing" class="editor-icon" type="button" aria-label="Clear drawing" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16m-11 0V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg>
                </button>
              </div>
              <div id="editor-content-tools" class="editor-content-tools" hidden>
                <div id="editor-font-options" class="editor-tool-size" hidden>
                  <label class="editor-icon" for="editor-font-size" aria-label="Font size" data-i18n-attributes="aria-label">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 18 5-12 5 12M5 14h6m4-3h6m-3-3v6m-3 4h6"/></svg>
                  </label>
                  <input id="editor-font-size" type="number" min="8" max="60" step="1" aria-label="Font size" data-i18n-attributes="aria-label">
                </div>
                <button id="editor-bold" class="editor-icon" type="button" aria-label="Bold" data-i18n-attributes="aria-label" aria-pressed="false" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h6a4 4 0 0 1 0 8H7Zm0 8h7a4 4 0 0 1 0 8H7Z" stroke-width="2.5"/></svg>
                </button>
                <div id="editor-alignment" class="editor-alignment" role="group" aria-label="Align content within the layer" data-i18n-attributes="aria-label">
                  <button type="button" class="editor-icon" data-align="left" aria-label="Align content left" data-i18n-attributes="aria-label" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg>
                  </button>
                  <button type="button" class="editor-icon" data-align="center" aria-label="Center content" data-i18n-attributes="aria-label" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg>
                  </button>
                  <button type="button" class="editor-icon" data-align="right" aria-label="Align content right" data-i18n-attributes="aria-label" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg>
                  </button>
                </div>
              </div>
              <div id="editor-canvas-alignment" class="editor-canvas-alignment" role="group" aria-label="Align layer to canvas" data-i18n-attributes="aria-label" hidden>
                <button type="button" class="editor-icon" data-canvas-align="left" aria-label="Align layer left" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18m3-15h10v4H7Zm0 8h13v4H7Z"/></svg>
                </button>
                <button type="button" class="editor-icon" data-canvas-align="center" aria-label="Center layer horizontally" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3m0 4v4m0 4v3M7 6h10v4H7Zm-3 8h16v4H4Z"/></svg>
                </button>
                <button type="button" class="editor-icon" data-canvas-align="right" aria-label="Align layer right" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3v18M7 6h10v4H7Zm-3 8h13v4H4Z"/></svg>
                </button>
                <button type="button" class="editor-icon" data-canvas-align="top" aria-label="Align layer top" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18M6 7h4v10H6Zm8 0h4v13h-4Z"/></svg>
                </button>
                <button type="button" class="editor-icon" data-canvas-align="middle" aria-label="Center layer vertically" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3m4 0h4m4 0h3M6 7h4v10H6Zm8-3h4v16h-4Z"/></svg>
                </button>
                <button type="button" class="editor-icon" data-canvas-align="bottom" aria-label="Align layer bottom" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 7h4v10H6Zm8-3h4v13h-4Z"/></svg>
                </button>
              </div>
            </div>
            <div id="editor-canvas-area" class="editor-canvas-area">
              <div class="bezel">
                <div id="editor-stage" data-tool="select" tabindex="-1" aria-label="Display canvas" data-i18n-attributes="aria-label" role="group">
                  <canvas id="editor-image" width="250" height="122" role="img" aria-label="Sample e-ink frame" data-i18n-attributes="aria-label"></canvas>
                  <div id="editor-selection" hidden aria-hidden="true">
                    <span class="editor-handle" data-corner="nw"></span>
                    <span class="editor-handle" data-corner="ne"></span>
                    <span class="editor-handle" data-corner="sw"></span>
                    <span class="editor-handle" data-corner="se"></span>
                  </div>
                  <div id="editor-marquee" hidden aria-hidden="true"></div>
                  <div id="editor-drop-marker" hidden aria-hidden="true"></div>
                  <div id="editor-guide-x" class="editor-guide" hidden aria-hidden="true"></div>
                  <div id="editor-guide-y" class="editor-guide" hidden aria-hidden="true"></div>
                  <textarea id="editor-inline-text" aria-label="Edit text on canvas" data-i18n-attributes="aria-label" rows="2" hidden></textarea>
                </div>
              </div>
            </div>
            <div class="editor-preview-status">
              <p id="editor-preview-status" class="editor-message" role="status"></p>
              <button id="editor-preview-retry" class="editor-icon" type="button" aria-label="Retry preview" data-i18n-attributes="aria-label" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v5h-5m5-.5A8 8 0 1 0 20 16"/></svg>
              </button>
            </div>
          </section>
          <aside class="editor-palette" aria-labelledby="editor-palette-title">
            <h3 id="editor-palette-title" data-i18n>Add widgets</h3>
            <div id="editor-palette" role="group" aria-labelledby="editor-palette-title"></div>
          </aside>
          <aside class="editor-inspector">
            <div id="editor-widget-settings" class="editor-widget-settings">
              <h3 id="editor-inspector-title" data-i18n>Widget settings</h3>
              <div id="editor-drawing-properties" class="setup-form" hidden>
                <button id="editor-remove-drawing" class="editor-icon" type="button" aria-label="Remove pen stroke" data-i18n-attributes="aria-label">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16m-11 0V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg>
                </button>
              </div>
              <div id="editor-properties" class="setup-form" hidden>
                <div class="editor-layer-heading">
                  <p id="editor-selected-widget"></p>
                  <button id="editor-remove" class="editor-icon" type="button" aria-label="Remove" data-i18n-attributes="aria-label">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16m-11 0V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg>
                  </button>
                </div>
                <label id="editor-scale-label" class="editor-scale" for="editor-scale">
                  <span data-i18n>Size (px)</span>
                  <input id="editor-scale" type="number" min="1" step="1">
                </label>
                <div id="editor-divider-settings" class="editor-geometry" hidden>
                  <label data-i18n>Length (px)<input id="editor-divider-length" type="number" min="1" step="1"></label>
                  <label data-i18n>Thickness (px)<input id="editor-divider-thickness" type="number" min="1" step="1"></label>
                </div>
                <details class="editor-precision">
                  <summary data-i18n>Position and dimensions</summary>
                  <div class="editor-geometry">
                    <label data-i18n>X<input type="number" min="0" step="1" data-property="x"></label>
                    <label data-i18n>Y<input type="number" min="0" step="1" data-property="y"></label>
                    <label data-i18n>Width<input type="number" min="1" step="1" data-property="w"></label>
                    <label data-i18n>Height<input type="number" min="1" step="1" data-property="h"></label>
                  </div>
                </details>
                <label id="editor-variant-label" data-i18n>Variant<select data-property="variant"></select></label>
                <div id="editor-format" hidden>
                  <label><span id="editor-format-label"></span><input type="text" data-property="format" maxlength="64" spellcheck="false" autocomplete="off" aria-describedby="editor-format-help"></label>
                  <p id="editor-format-help"></p>
                </div>
                <div id="editor-text-style" class="editor-text-style">
                  <label data-i18n>Font<select data-property="font"><option value="regular" data-i18n>Regular</option><option value="bold" data-i18n>Bold</option><option value="mono" data-i18n>Monospace</option><option value="mono-bold" data-i18n>Bold monospace</option></select></label>
                </div>
                <label id="editor-text-label" data-i18n>Custom text<textarea rows="2" maxlength="240" data-property="text"></textarea></label>
              </div>
            </div>
            <div id="editor-layer-panel" class="editor-widgets">
              <h3 id="editor-widgets-title" data-i18n>Layers</h3>
              <ul id="editor-widgets" aria-labelledby="editor-widgets-title"></ul>
            </div>
            <section id="editor-library" aria-labelledby="editor-library-title" hidden>
              <h3 id="editor-library-title" data-i18n>Saved layouts</h3>
              <form id="editor-library-form" class="setup-form">
                <label for="editor-library-name" data-i18n>Layout name</label>
                <div class="editor-library-row">
                  <input id="editor-library-name" required maxlength="64" autocomplete="off">
                  <button id="editor-library-save" class="editor-icon" type="submit" aria-label="Save to library" data-i18n-attributes="aria-label" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3Zm3 0v6h10V3M7 21v-8h10v8m-3-15v3"/></svg>
                  </button>
                </div>
              </form>
              <ul id="editor-library-list" aria-labelledby="editor-library-title"></ul>
              <p id="editor-library-status" class="editor-message" role="status"></p>
            </section>
          </aside>
        </div>
        <div class="editor-status">
          <p id="editor-save-status" class="editor-message" role="status"></p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
