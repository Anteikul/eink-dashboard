<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece5">
  <title>Display · E‑ink</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/locale.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="header-line">
        <h1 data-i18n>Display</h1>
        <div class="header-actions">
          <a id="open-editor" href="/editor" aria-label="Edit layouts" title="Edit layouts" data-i18n-attributes="aria-label title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4m-14 6 4 4M16 4l1-1a1.4 1.4 0 0 1 2 0l2 2a1.4 1.4 0 0 1 0 2l-1 1"/></svg>
          </a>
          <a id="open-settings" href="/settings" aria-label="Settings" title="Settings" data-i18n-attributes="aria-label title">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 3h4l.5 2.5 1.3.7 2.4-.8 2 3.5-1.9 1.7v1.5l1.9 1.7-2 3.5-2.4-.8-1.3.7L14 20h-4l-.5-2.8-1.3-.7-2.4.8-2-3.5 1.9-1.7v-1.5L3.8 8.9l2-3.5 2.4.8 1.3-.7z"/>
              <circle cx="12" cy="11.5" r="3"/>
            </svg>
          </a>
        </div>
      </div>
    </header>
    <section aria-label="Screen" data-i18n-attributes="aria-label">
      <div class="bezel">
        <div class="screen">
          <p id="placeholder" data-i18n>Waiting for the first frame…</p>
          <img id="preview" width="250" height="122" alt="Last frame sent to the display" data-i18n-attributes="alt" hidden>
        </div>
      </div>
      <p class="track-link" id="track-link" hidden data-i18n><a rel="noreferrer" data-i18n>Open track in Spotify</a></p>
    </section>
    <details id="saved-layouts" class="quick-layouts">
      <summary data-i18n>Saved layouts</summary>
      <fieldset id="quick-layout-options" aria-label="Saved layouts" data-i18n-attributes="aria-label" hidden disabled>
        <section data-screen="dashboard" aria-labelledby="quick-dashboard-heading">
          <h3 id="quick-dashboard-heading" data-i18n>Dashboard</h3>
          <button type="button" data-layout="" data-i18n>Default layout</button>
          <div data-saved-names></div>
        </section>
        <section data-screen="playback" aria-labelledby="quick-playback-heading">
          <h3 id="quick-playback-heading" data-i18n>Playback</h3>
          <button type="button" data-layout="" data-i18n>Default layout</button>
          <div data-saved-names></div>
        </section>
      </fieldset>
      <p id="quick-layout-status" role="status"></p>
    </details>
    <section class="settings" aria-labelledby="display-mode-heading">
      <h2 id="display-mode-heading" data-i18n>Display mode</h2>
      <fieldset id="mode-controls" data-control="mode" aria-labelledby="display-mode-heading" disabled>
        <button type="button" data-mode="auto" aria-pressed="false" data-i18n>Automatic</button>
        <button type="button" data-mode="dashboard" aria-pressed="false" data-i18n>Dashboard</button>
        <button type="button" data-mode="playback" aria-pressed="false" data-i18n>Playback</button>
      </fieldset>
    </section>
    <section class="settings" aria-labelledby="settings-heading">
      <h2 id="settings-heading" data-i18n>Display theme</h2>
      <fieldset data-control="theme" aria-labelledby="settings-heading" disabled>
        <button type="button" data-theme="light" aria-pressed="false" data-i18n>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          Light
        </button>
        <button type="button" data-theme="dark" aria-pressed="false" data-i18n>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14.1A8.9 8.9 0 0 1 9.9 3.2 9 9 0 1 0 20.8 14.1Z"/></svg>
          Dark
        </button>
      </fieldset>
    </section>
    <p id="status" role="status" data-i18n>Connecting to the display…</p>
  </main>
</body>
</html>
